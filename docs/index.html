<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VRChat Bridge Camera</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            pointer-events: none;
            max-width: 90%;
            line-height: 1.4;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f00;
            margin-right: 5px;
        }

        .dot.connected {
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
        }

        #debug-info {
            font-size: 9px;
            color: #888;
            margin-top: 5px;
            word-break: break-all;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }

        button:active {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Visual feedback for crop area */
        #crop-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 255, 0, 0.5);
            pointer-events: none;
            display: none;
        }
    </style>
</head>

<body>
    <div id="status">
        <span class="dot" id="dot"></span> <span id="msg">Connecting...</span>
        <div id="debug-info"></div>
    </div>
    <video id="cam" autoplay playsinline muted></video>
    <div id="crop-overlay"></div>
    <div id="controls">
        <button id="btnSwitch">📷 Switch Cam</button>
        <button id="btnQual">Low Quality (Fast)</button>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('cam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const dot = document.getElementById('dot');
        const msg = document.getElementById('msg');
        const debugInfo = document.getElementById('debug-info');
        const cropOverlay = document.getElementById('crop-overlay');

        let streaming = true;
        let quality = 0.4; // OPTIMIZED: Lower quality for faster upload
        let interval = 100; // OPTIMIZED: 10 FPS max (realistic for upload)
        let facingMode = 'user';
        let postUrl = '/video';
        let useCrop = true; // OPTIMIZED: Always use crop for face tracking

        // CRITICAL FIX: Parse tunnel URL from query string
        function getTargetUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const tunnelUrl = urlParams.get('tunnel');

            if (tunnelUrl) {
                const target = tunnelUrl.startsWith('http') ? tunnelUrl : 'https://' + tunnelUrl;
                return target + '/video';
            } else {
                return '/video';
            }
        }

        postUrl = getTargetUrl();

        // Display debug info
        debugInfo.innerHTML = `Target: ${postUrl}<br>Crop: ${useCrop ? 'ON (192x192)' : 'OFF'}`;
        console.log('[DEBUG] Target URL:', postUrl);

        // Start Camera - OPTIMIZED RESOLUTION
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 320 },  // OPTIMIZED: Reduced from 640
                        height: { ideal: 240 }, // OPTIMIZED: Reduced from 480
                        frameRate: { ideal: 15 } // OPTIMIZED: Reduced from 30
                    },
                    audio: false
                });
                video.srcObject = stream;
                msg.textContent = "Camera Ready - Sending...";
                console.log('[INFO] Camera started (320x240@15fps)');

                // Update crop overlay size
                video.onloadedmetadata = () => {
                    const cropSize = Math.min(video.videoWidth, video.videoHeight);
                    cropOverlay.style.width = cropSize + 'px';
                    cropOverlay.style.height = cropSize + 'px';
                };
            } catch (e) {
                msg.textContent = "Cam Error: " + e.message;
                console.error('[ERROR] Camera error:', e);
            }
        }

        // Send Frame Loop with CROP optimization
        let lastTime = 0;
        let frameCount = 0;
        let errorCount = 0;
        let sending = false; // Prevent overlapping sends
        let fpsCounter = 0;
        let fpsTime = Date.now();

        async function sendFrame(time) {
            if (!streaming || sending) {
                requestAnimationFrame(sendFrame);
                return;
            }

            if (time - lastTime >= interval) {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    // Draw full video to canvas
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    ctx.drawImage(video, 0, 0);
                    ctx.restore();

                    // OPTIMIZATION: Crop to center 192x192 (face region)
                    let finalCanvas = canvas;

                    if (useCrop) {
                        const cropSize = 192;
                        const cropX = (canvas.width - cropSize) / 2;
                        const cropY = (canvas.height - cropSize) / 2;

                        const croppedCanvas = document.createElement('canvas');
                        croppedCanvas.width = cropSize;
                        croppedCanvas.height = cropSize;
                        croppedCanvas.getContext('2d').drawImage(
                            canvas, cropX, cropY, cropSize, cropSize,
                            0, 0, cropSize, cropSize
                        );

                        finalCanvas = croppedCanvas;
                    }

                    // Send via POST
                    sending = true;
                    finalCanvas.toBlob(async (blob) => {
                        if (blob) {
                            try {
                                const response = await fetch(postUrl, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'image/jpeg' },
                                    body: blob,
                                    mode: 'cors'
                                });

                                if (!response.ok) {
                                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                                }

                                frameCount++;
                                fpsCounter++;
                                errorCount = 0;
                                dot.classList.add('connected');

                                // Calculate real FPS
                                const now = Date.now();
                                if (now - fpsTime >= 1000) {
                                    const realFps = fpsCounter;
                                    msg.textContent = `LIVE ${realFps} FPS (${Math.round(blob.size / 1024)}KB)`;
                                    debugInfo.innerHTML = `Target: ${postUrl}<br>Crop: ${useCrop ? 'ON (192x192)' : 'OFF'}<br>Frames: ${frameCount}`;
                                    fpsCounter = 0;
                                    fpsTime = now;
                                }

                                if (frameCount === 1) {
                                    console.log('[SUCCESS] First frame sent!', blob.size, 'bytes');
                                }
                            } catch (e) {
                                errorCount++;
                                dot.classList.remove('connected');
                                msg.textContent = `Error: ${e.message}`;
                                debugInfo.innerHTML = `Target: ${postUrl}<br>Error: ${e.message}<br>Failed: ${errorCount}`;
                                console.error('[ERROR] Fetch failed:', e);
                            } finally {
                                sending = false;
                            }
                        } else {
                            sending = false;
                        }
                    }, 'image/jpeg', quality);
                }
                lastTime = time;
            }
            requestAnimationFrame(sendFrame);
        }

        // Controls
        document.getElementById('btnSwitch').onclick = () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        };

        let lowQuality = true;
        document.getElementById('btnQual').onclick = (e) => {
            lowQuality = !lowQuality;
            quality = lowQuality ? 0.4 : 0.7;
            e.target.textContent = lowQuality ? "High Quality (Slow)" : "Low Quality (Fast)";
            e.target.style.background = lowQuality ? "" : "rgba(255, 0, 0, 0.4)";
        };

        // Init
        startCamera();
        requestAnimationFrame(sendFrame);

        console.log('[INIT] VRChat Bridge Camera (OPTIMIZED)');
        console.log('[INIT] Resolution: 320x240, Quality:', quality, 'Crop:', useCrop);
    </script>
</body>

</html>
