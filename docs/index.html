<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VRChat Face Tracking (MediaPipe)</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 12px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.6;
            max-width: 90%;
            z-index: 10;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f00;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        .dot.connected {
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            font-weight: bold;
            font-size: 13px;
        }

        button:active {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
    <!-- MediaPipe Face Mesh CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="status">
        <span class="dot" id="dot"></span> <span id="msg">Loading MediaPipe...</span>
        <div id="debug"></div>
    </div>

    <div id="controls">
        <button id="btnSwitch">📷 Flip</button>
        <button id="btnLandmarks">Hide Landmarks</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const dot = document.getElementById('dot');
        const msg = document.getElementById('msg');
        const debug = document.getElementById('debug');

        let postUrl = '/tracking';
        let facingMode = 'user';
        let showLandmarks = true;
        let frameCount = 0;
        let fpsCounter = 0;
        let fpsTime = Date.now();
        let connected = false;

        // Parse tunnel URL
        const urlParams = new URLSearchParams(window.location.search);
        const tunnelUrl = urlParams.get('tunnel');
        if (tunnelUrl) {
            const target = tunnelUrl.startsWith('http') ? tunnelUrl : 'https://' + tunnelUrl;
            postUrl = target + '/tracking';
        }

        debug.innerHTML = `Target: ${postUrl}<br>Mode: MediaPipe Face Mesh`;

        // Detect low-end device
        const isLowEnd = navigator.hardwareConcurrency < 4 || /Android [4-7]/.test(navigator.userAgent);

        // Initialize MediaPipe Face Mesh
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: !isLowEnd, // Disable iris on old phones
            minDetectionConfidence: isLowEnd ? 0.3 : 0.5,
            minTrackingConfidence: isLowEnd ? 0.3 : 0.5
        });

        console.log('[MediaPipe] Config:', isLowEnd ? 'Low-end mode' : 'High quality mode');

        // Helper: Distance between two points
        function distance(p1, p2) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dz = (p1.z || 0) - (p2.z || 0);
            return Math.sqrt(dx * dx + dy * dy + dz * dz);
        }

        // Calculate Eye Aspect Ratio (EAR)
        function calculateEAR(eye) {
            // eye = [p1, p2, p3, p4, p5, p6]
            // Vertical distances
            const v1 = distance(eye[1], eye[5]);
            const v2 = distance(eye[2], eye[4]);
            // Horizontal distance
            const h = distance(eye[0], eye[3]);
            return h > 0.001 ? (v1 + v2) / (2.0 * h) : 0;
        }

        // Calculate ARKit Blendshapes from MediaPipe landmarks
        function calculateBlendshapes(landmarks) {
            if (!landmarks || landmarks.length < 468) return null;

            // MediaPipe landmark indices (based on the 468-point mesh)
            // Eyes
            const leftEye = [33, 160, 158, 133, 153, 144].map(i => landmarks[i]);
            const rightEye = [362, 385, 387, 263, 373, 380].map(i => landmarks[i]);

            const leftEAR = calculateEAR(leftEye);
            const rightEAR = calculateEAR(rightEye);

            // Blink detection (inverse of EAR)
            const eyeBlinkLeft = Math.max(0, Math.min(1, 1 - leftEAR * 2.5));
            const eyeBlinkRight = Math.max(0, Math.min(1, 1 - rightEAR * 2.5));

            // Mouth
            const mouthLeft = landmarks[61];
            const mouthRight = landmarks[291];
            const mouthTop = landmarks[13];
            const mouthBottom = landmarks[14];
            const mouthUpperInner = landmarks[13];
            const mouthLowerInner = landmarks[14];

            const mouthHeight = distance(mouthTop, mouthBottom);
            const mouthWidth = distance(mouthLeft, mouthRight);

            // Estimate face height for normalization
            const noseTip = landmarks[1];
            const chin = landmarks[199];
            const faceHeight = distance(noseTip, chin);

            const jawOpen = faceHeight > 0.001 ? Math.min(1, mouthHeight / (faceHeight * 0.25)) : 0;

            // Smile detection (corners elevation)
            const mouthCenter = landmarks[13];
            const smileLeft = Math.max(0, (mouthCenter.y - mouthLeft.y) / (faceHeight * 0.1));
            const smileRight = Math.max(0, (mouthCenter.y - mouthRight.y) / (faceHeight * 0.1));

            // Pucker (mouth width reduction)
            const neutralMouthWidth = faceHeight * 0.3;
            const mouthPucker = neutralMouthWidth > 0 ? Math.max(0, 1 - mouthWidth / neutralMouthWidth) : 0;

            // Eyebrows
            const leftBrowInner = landmarks[55];
            const rightBrowInner = landmarks[285];
            const noseBridge = landmarks[6];

            const leftBrowHeight = noseBridge.y - leftBrowInner.y;
            const rightBrowHeight = noseBridge.y - rightBrowInner.y;

            const browInnerUp = Math.max(0, Math.min(1, (leftBrowHeight + rightBrowHeight) / (faceHeight * 0.15)));

            // Construct ARKit-compatible blendshapes
            return {
                // Eyes
                eyeBlinkLeft: eyeBlinkLeft,
                eyeBlinkRight: eyeBlinkRight,
                eyeSquintLeft: eyeBlinkLeft * 0.5, // Approximation
                eyeSquintRight: eyeBlinkRight * 0.5,
                eyeWideLeft: Math.max(0, leftEAR - 0.15) * 2,
                eyeWideRight: Math.max(0, rightEAR - 0.15) * 2,

                // Jaw
                jawOpen: jawOpen,
                jawForward: 0,
                jawLeft: 0,
                jawRight: 0,

                // Mouth
                mouthSmileLeft: Math.min(1, smileLeft),
                mouthSmileRight: Math.min(1, smileRight),
                mouthFrownLeft: 0,
                mouthFrownRight: 0,
                mouthPucker: Math.min(1, mouthPucker),
                mouthFunnel: jawOpen * 0.3, // Approximation

                // Brows
                browInnerUp: browInnerUp,
                browOuterUpLeft: browInnerUp * 0.7,
                browOuterUpRight: browInnerUp * 0.7,
                browDownLeft: 0,
                browDownRight: 0
            };
        }

        // MediaPipe results callback
        faceMesh.onResults((results) => {
            // Clear canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Draw landmarks
                if (showLandmarks) {
                    ctx.save();
                    ctx.scale(-1, 1);
                    ctx.translate(-canvas.width, 0);

                    // Draw mesh
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                    for (const landmark of landmarks) {
                        ctx.beginPath();
                        ctx.arc(landmark.x * canvas.width, landmark.y * canvas.height, 1, 0, 2 * Math.PI);
                        ctx.fill();
                    }

                    ctx.restore();
                }

                // Calculate blendshapes
                const blendshapes = calculateBlendshapes(landmarks);

                if (blendshapes) {
                    // Send to PC
                    sendBlendshapes(blendshapes);
                }
            }
        });

        // Send blendshapes via JSON POST
        let sending = false;
        async function sendBlendshapes(blendshapes) {
            if (sending) return;

            sending = true;
            try {
                const response = await fetch(postUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(blendshapes),
                    mode: 'cors'
                });

                if (response.ok) {
                    frameCount++;
                    fpsCounter++;
                    connected = true;
                    dot.classList.add('connected');

                    // Calculate FPS
                    const now = Date.now();
                    if (now - fpsTime >= 1000) {
                        const fps = fpsCounter;
                        msg.textContent = `LIVE ${fps} FPS`;
                        debug.innerHTML = `Target: ${postUrl}<br>Frames: ${frameCount}<br>Quality: ${isLowEnd ? 'Lite' : 'High'}`;
                        fpsCounter = 0;
                        fpsTime = now;
                    }
                } else {
                    connected = false;
                    dot.classList.remove('connected');
                    msg.textContent = `Error: HTTP ${response.status}`;
                }
            } catch (e) {
                connected = false;
                dot.classList.remove('connected');
                msg.textContent = `Error: ${e.message}`;
                console.error('[ERROR]', e);
            } finally {
                sending = false;
            }
        }

        // Start camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 30 }
                    },
                    audio: false
                });

                video.srcObject = stream;

                // Wait for video to be ready
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        console.log('[Camera] Resolution:', video.videoWidth, 'x', video.videoHeight);
                        video.play();
                        resolve();
                    };
                });

                msg.textContent = 'Processing...';

                // Start MediaPipe processing loop (manual requestAnimationFrame)
                async function processFrame() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        await faceMesh.send({ image: video });
                    }
                    requestAnimationFrame(processFrame);
                }

                processFrame();
                console.log('[MediaPipe] Processing loop started');

            } catch (e) {
                msg.textContent = `Camera Error: ${e.message}`;
                console.error('[ERROR] Camera:', e);
            }
        }

        // Controls
        document.getElementById('btnSwitch').onclick = () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        };

        document.getElementById('btnLandmarks').onclick = (e) => {
            showLandmarks = !showLandmarks;
            e.target.textContent = showLandmarks ? 'Hide Landmarks' : 'Show Landmarks';
        };

        // Init
        console.log('[INIT] VRChat Face Tracking (MediaPipe Mode)');
        console.log('[INIT] Target:', postUrl);
        console.log('[INIT] Performance mode:', isLowEnd ? 'Lite' : 'High');

        startCamera();
    </script>
</body>

</html>
