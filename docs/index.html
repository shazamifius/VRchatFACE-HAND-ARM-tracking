<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="VRChat Universal Video Bridge - Phone Camera Link">
    <title>VRChat Phone Link</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Status Bar -->
    <div id="status-bar">
        <div class="status-indicator">
            <span class="dot" id="connection-dot"></span>
            <span id="status-text">Initializing...</span>
        </div>
        <div class="stats">
            <span id="fps-counter">0 FPS</span>
        </div>
    </div>

    <!-- Main Video Feed -->
    <video id="camera" autoplay playsinline muted></video>

    <!-- Hidden Canvas for Frame Capture -->
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Control Panel -->
    <div id="controls">
        <button id="btn-flip" class="control-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16" />
            </svg>
            <span>Flip</span>
        </button>

        <button id="btn-quality" class="control-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                <line x1="7" y1="2" x2="7" y2="22"></line>
                <line x1="17" y1="2" x2="17" y2="22"></line>
                <line x1="2" y1="12" x2="22" y2="12"></line>
            </svg>
            <span id="quality-label">HD</span>
        </button>
    </div>

    <!-- Error Display -->
    <div id="error-message" class="hidden">
        <div class="error-content">
            <h2>⚠️ Connection Error</h2>
            <p id="error-text"></p>
            <button id="btn-retry" class="retry-btn">Retry Connection</button>
        </div>
    </div>

    <!-- Branding -->
    <div id="branding">
        <a href="https://github.com/shazamifius/VRchatFACE-HAND-ARM-tracking" target="_blank">
            VRChat Universal Video Bridge
        </a>
    </div>

    <script src="app.js"></script>
</body>

</html>
